<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - Kost Mutmainah</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="navbar">
    <div class="logo">Kost Mutmainah</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="kamar.html">Kamar</a>
        <a href="kontak.html">Kontak</a>
        <a href="index.html?login=1" class="btn-login">Login</a>
    </nav>
</div>

<div class="booking-section">
    <h1>Daftar Akun</h1>
    <p class="sub">Buat akun untuk mulai memesan kamar di Kost Mutmainah.</p>
    <div class="form-box" id="formBoxRegister"></div>
</div>

<footer>&copy; 2026 Kost Mutmainah. All Rights Reserved.</footer>

<script src="js/app.js"></script>
<script>
const redirectUrl = qs('redirect_url') || '';

function renderRegisterForm(error){
    document.getElementById('formBoxRegister').innerHTML = `
        ${error ? `<div class="error-msg">${error}</div>` : ''}
        <form id="formRegister">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="regUsername" placeholder="Masukkan username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="Minimal 6 karakter" required>
            </div>
            <div class="form-group">
                <label>Konfirmasi Password</label>
                <input type="password" id="regKonfirmasi" placeholder="Ulangi password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;">Daftar</button>
        </form>
        <p class="sub" style="margin-top:16px;">
            Sudah punya akun? <a href="index.html?login=1&redirect_url=${encodeURIComponent(redirectUrl)}">Login di sini</a>
        </p>`;

    document.getElementById('formRegister').addEventListener('submit', function(e){
        e.preventDefault();
        const username = document.getElementById('regUsername').value.trim();
        const password = document.getElementById('regPassword').value;
        const konfirmasi = document.getElementById('regKonfirmasi').value;

        if (!username || !password || !konfirmasi) return renderRegisterForm('Semua kolom wajib diisi.');
        if (username.length < 4) return renderRegisterForm('Username minimal 4 karakter.');
        if (password.length < 6) return renderRegisterForm('Password minimal 6 karakter.');
        if (password !== konfirmasi) return renderRegisterForm('Konfirmasi password tidak cocok.');

        const result = actionRegister(username, password);
        if (result.error) return renderRegisterForm(result.error);
        renderRegisterSuccess();
    });
}

function renderRegisterSuccess(){
    document.getElementById('formBoxRegister').innerHTML = `
        <div class="success-box">
            <h2>Registrasi Berhasil!</h2>
            <p>Akun kamu sudah dibuat. Silakan login untuk melanjutkan.</p>
            <a href="index.html?login=1&redirect_url=${encodeURIComponent(redirectUrl)}" class="btn btn-primary">Login Sekarang</a>
        </div>`;
}

renderRegisterForm(null);
</script>
</body>
</html>
